
name: Build PICK APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q PICK_GitHub_Upload.zip -d project

      - name: Align JVM targets
        run: |
          APP=$(find project -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' | head -n 1)

          if [ -z "$APP" ]; then
            echo "App Gradle file not found"
            exit 1
          fi

          if [[ "$APP" == *.kts ]]; then
            cat >> "$APP" <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          EOF
          else
            cat >> "$APP" <<'EOF'

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF
          fi

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          gradle --no-daemon -p "$(dirname "$SETTINGS")" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PICK-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
